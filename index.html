<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Filmes</title>
        <link rel="stylesheet" href="css/style.css" />
        <script src="js/post.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Cadastro de filmes</h1>
            <small>Preencha os dados abaixo!!!</small>
        </header>

        <main>
            <section id="intro">
                <p><a href="pages/get.html">Consultar heróis</a></p>
                <h2>Novo filme</h2>

                <form id="form-filme" method="post">
                    <label for="title">Nome do filme:</label>
                    <input id="title" name="title" type="text" minlength="3" maxlength="120" required />

                    <label for="genero">Gênero:</label>
                    <input id="genero" name="genero" type="text" required />

                    <label for="ano">Ano:</label>
                    <input id="ano" name="ano" type="number" required />

                    <label for="diretor">Diretor:</label>
                    <input id="diretor" name="diretor" type="text" required />

                    <label for="nota">Nota:</label>
                    <input id="nota" name="nota" type="number" required />

                    <label for="imageUrl">URL da imagem (opcional):</label>
                    <input id="imageUrl" name="imageUrl" type="url" />

                    <button type="submit">Cadastrar filme</button>
                </form>

                <p id="resposta"></p>

            </section>
        </main>

        <footer>
            <p>Prática de formulários HTML.</p>
        </footer>
    </body>
</html>
