<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Lista de filmes</title> 
        <link rel="stylesheet" href="../css/get.css" />
        <script src="../js/get.js"></script>
    </head>
    <body>
        <header>
            <h1>Lista de filmes</h1>
            <p>Veja abaixo a lista de filmes</p>
        </header>

        <main>
            <p><a href="../index.html">Voltar para o cadastro</a></p>
            <section id="container-titulo-lista">
                <h2 id="titulo-lista">Filmes cadastrados</h2>
                <p>Os filmes são exibidos automaticamente ao abrir a página</p>
                <p id="resposta"></p>
                <ul id="lista-filmes"></ul>
            </section>
        </main>

        <!--Modelo  para o JS copiar para cada filme-->
        <template id="modelo-filme">
            <li>
                <section class="card-capa">
                    <span class="sem-imagem">Imagem indisponivel</span>
                    <img class="imagem-filme" alt="" />
                </section>
                <section class="card-conteudo">
                    <h3 class="nome"></h3>
                    <p><strong>Gênero:</strong> <span class="genero"> </span></p>
                    <p><strong>Ano:</strong> <span class="ano"> </span></p>
                    <p><strong>Diretor:</strong> <span class="diretor"> </span></p>
                    <p><strong>Nota:</strong> <span class="nota"> </span></p>
                </section>
            </li>
        </template>
    </body>
</html>
